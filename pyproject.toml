[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-seo"
version = "0.1.0"
description = "Keel SEO — reusable Landing Registry, sitemap, noindex-by-default gate, and critical-CSS engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Milad Safaei" }]
license = { text = "UNLICENSED" }
dependencies = ["Django>=4.2"]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-seo"

[tool.hatch.build.targets.wheel]
packages = ["src/keel_seo"]

[tool.hatch.build.targets.wheel.force-include]
"src/keel_seo/templates" = "keel_seo/templates"
"src/keel_seo/tools" = "keel_seo/tools"
