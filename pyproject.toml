[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel-seo"
version = "0.30.4"
description = "Keel SEO — reusable Landing Registry, sitemap, noindex-by-default gate, intent registry, critical-CSS engine, a complete Google Search Console API client (Search Analytics, URL Inspection, Indexing, Sitemaps, Sites), and an autocomplete-only keyword-universe crawler with lexical clustering."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Milad Safaei" }]
license = { text = "UNLICENSED" }
dependencies = ["Django>=4.2"]

# The GSC query-intelligence CLI (keel_seo.gsc) is optional — a host that does not
# pull Search Console data carries none of these. Install with: pip install 'keel-seo[gsc]'
[project.optional-dependencies]
gsc = ["google-api-python-client>=2.0", "google-auth>=2.0", "openpyxl>=3.0"]
# Proxy rotation for keel_seo.keywords is keel-crawler's capability, not this
# package's; it is soft-imported so a host that only wants the Landing registry
# does not install a crawler. See keel_seo/keywords/proxying.py.
#
# A direct git reference, not a version range: no keel package is published to
# PyPI, so "keel-crawler>=0.9.0" resolves to nothing and pip fails with "No
# matching distribution found" - which is exactly what it did on the production
# host. Every keel consumer already pins these by git tag for the same reason.
proxies = [
    "keel-crawler @ git+https://github.com/miladsafaei-me/keel-crawler@v0.15.2",
]
# The .xlsx workbook. Optional so the crawler stays stdlib-only by default; the
# JSON, CSV and Markdown are always written, so a missing openpyxl costs the
# workbook and nothing else.
xlsx = ["openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/miladsafaei-me/keel-seo"

# Required for the `proxies` extra: hatchling refuses a direct (git) reference in
# optional-dependencies unless this is set, and no keel package is on PyPI, so a
# direct reference is the only form that resolves. Without it the build fails at
# metadata generation, not at install time, which makes it look like a broken
# package rather than a missing flag.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/keel_seo"]
# hatchling includes every file under the package (templates/, tools/, migrations/,
# non-.py assets) automatically — no force-include (which would double-add them and
# fail the build with "a second file is being added at the same path").
